name: Core search tests
on:
  pull_request:
    paths:
      [
        'README*.md',
        'CONTRIBUTING*.md',
        'docs/**',
        'src/**',
        'package.json',
        'pnpm-lock.yaml',
        'eslint.config.js',
        'tests/**',
        'scripts/**',
        'evaluation/**',
        '.github/workflows/core-tests.yml',
      ]
  push:
    branches: [main]
    paths:
      [
        'README*.md',
        'CONTRIBUTING*.md',
        'docs/**',
        'src/**',
        'package.json',
        'pnpm-lock.yaml',
        'eslint.config.js',
        'tests/**',
        'scripts/**',
        'evaluation/**',
        '.github/workflows/core-tests.yml',
      ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v3
        with:
          version: 8.15.9
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm exec tsc --noEmit -p tsconfig.test.json
      - run: node --test scripts/evaluation/*.test.mjs
      - run: node --test scripts/e2e/*.test.mjs
      - run: pnpm run test:protocol
      - run: pnpm test
